[package]
name = "mailgo-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ammonia = "4.1.4"
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
imap = { version = "3.0.0-alpha.15", default-features = true }
image = { version = "0.25.0", default-features = false, features = ["png"] }
hmac = "0.13.0"
keyring = "4.2"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
mail-parser = { version = "0.11.8", features = ["full_encoding"] }
native-tls = "0.2.18"
rand = "0.8"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rdesktop-core = { git = "https://github.com/neko233-com/rdesktop", version = "0.1.8" }
rdesktop-webview = { git = "https://github.com/neko233-com/rdesktop", version = "0.1.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3"
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }
url = "2.5"
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

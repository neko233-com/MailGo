[package]
name = "mailgo-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ammonia = "4.1.4"
anyhow = "1"
base64 = "0.22"
imap = { version = "3.0.0-alpha.15", default-features = true }
keyring = "4.2"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
mail-parser = "0.11.8"
rand = "0.8"
rdesktop-core = { git = "https://github.com/neko233-com/rdesktop", version = "0.1.8" }
rdesktop-webview = { git = "https://github.com/neko233-com/rdesktop", version = "0.1.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
